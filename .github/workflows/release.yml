name: ios-release

# Signing, archiving and TestFlight are all authorised by one App Store Connect
# API key; nothing here needs a certificate or a profile checked into the repo.
# That key is *not* an APNs key and cannot enable push — see docs/release.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (defaults to the tag, or 1.0)
        required: false

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15

    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Optional until the distribution identity is copied here. Without it,
      # automatic signing mints a certificate for every run.
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # A tag means you intended to ship. Failing here with the missing names is
      # the whole point: the alternative is an xcodebuild error forty lines deep
      # that says nothing about which credential is absent.
      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY:-}" ]      || missing+=("APP_STORE_CONNECT_KEY (the .p8 contents, PEM or base64)")
          [ -n "${ASC_KEY_ID:-}" ]   || missing+=("APP_STORE_CONNECT_KEY_ID (10 chars, from the key's page or its filename)")
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID (UUID, from App Store Connect > Users and Access > Integrations)")
          [ -n "${TEAM_ID:-}" ]       || missing+=("APPLE_TEAM_ID (10 chars, from Membership)")
          # The App Store Connect key and the signing identity live on
          # innotelinc/coursemate, and a secret set on one repository cannot be
          # read from another. Nothing can be signed here until those values are
          # copied across, so this says exactly that and leaves the run green: a
          # red X on a release tag cannot be told apart from a build that broke.
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::No release credentials in this repository — nothing was built."
            for m in "${missing[@]}"; do echo "::warning::missing secret: $m"; done
            echo "::warning::Release from the repository that holds the key: gh workflow run ios-release.yml --repo innotelinc/coursemate -f version=${GITHUB_REF_NAME#v}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GITHUB_REF_NAME#v}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} carries no version."; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The key is written to the two places Apple's tooling looks for it:
      # RUNNER_TEMP for xcodebuild's explicit -authenticationKeyPath, and
      # ~/.appstoreconnect/private_keys for altool, which has no path flag.
      - name: Install App Store Connect key
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          if printf '%s' "$ASC_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          else
            printf '%s' "$ASC_KEY" | tr -d '\n' | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          fi
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          # Prove the material parses before spending a build on it. A key that
          # is truncated, or that has had its newlines eaten, fails here.
          openssl pkey -in "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" -noout
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          echo "KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Project file matches its generator
        run: |
          python3 tools/gen-project.py
          if ! git diff --quiet -- CourseMate.xcodeproj; then
            echo "::error::CourseMate.xcodeproj is out of date — run 'python3 tools/gen-project.py' and commit the result."
            exit 1
          fi

      # Version comes from the tag, build number from the run, so the binary in
      # TestFlight can be matched to a commit without editing the generator.
      - name: Resolve version
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.0"; fi
          fi
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # App Store Connect refuses the iOS 18.x SDK, so the toolchain is chosen
      # explicitly and checked before the build: failing here costs a minute,
      # failing at upload costs ten and says only "SDK version issue".
      - name: Select the newest Xcode
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          best=""; bestv=0
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')
            [ -z "$v" ] && continue
            echo "found $app -> $v"
            major=${v%%.*}
            if [ "$major" -gt "$bestv" ]; then best="$app"; bestv=$major; fi
          done
          if [ "$bestv" -lt 26 ]; then
            echo "::error::This image carries no Xcode 26; App Store Connect rejects the iOS 18.5 SDK. Move the job to a runner image that has Xcode 26."
            exit 1
          fi
          sudo xcode-select -s "$best"
          xcodebuild -version

      # One distribution identity, reused forever. Without it automatic signing
      # mints a certificate on every ephemeral runner — the private key dies with
      # the runner — until Apple's certificate limit refuses the next release.
      - name: Install the signing identity
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_P12:-}" ]; then
            echo "::warning::SIGNING_P12 is not set; automatic signing will mint a certificate for this run."
            exit 0
          fi
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/signing.p12" -k build.keychain -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Archive
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CourseMate.xcodeproj \
            -scheme CourseMate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CourseMate.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tail -n 250

      # app-store-connect rather than the deprecated app-store method: the
      # simulator-only destruction of old binaries is not wanted here.
      - name: Export IPA
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CourseMate.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tail -n 250
          ls -1 "$RUNNER_TEMP/export"

      # altool reports success asynchronously: it prints the delivery UUID, and
      # processing (and any rejection) shows up later in App Store Connect. A
      # green run means "Apple accepted the upload", not "it is testable yet".
      - name: Upload to TestFlight
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Publish GitHub release
        if: steps.preflight.outputs.ready == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/CourseMate.xcarchive/dSYMs" "$RUNNER_TEMP/CourseMate-dSYMs.zip" || true
          assets=("$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)")
          # dSYMs are attached because a crash from TestFlight is only
          # symbolicated against the exact build that produced it.
          if [ -f "$RUNNER_TEMP/CourseMate-dSYMs.zip" ]; then
            assets+=("$RUNNER_TEMP/CourseMate-dSYMs.zip")
          fi
          # A re-run of an existing tag must replace the assets, not fail:
          # `release create` on a tag that already has a release is an error.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CourseMate $MARKETING_VERSION ($BUILD_NUMBER)" \
              --notes "Built from ${GITHUB_SHA:0:7} by ios-release. Uploaded to TestFlight as build $BUILD_NUMBER."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            ${{ runner.temp }}/upload.log
            build/Logs
          if-no-files-found: ignore
          retention-days: 14
