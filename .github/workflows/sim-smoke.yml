# Run the app in a simulator and photograph what it shows.
#
# CI already compiles for the simulator, which proves the Swift type-checks.
# It never launches anything, so every question about what the app does once it
# is running — does it boot, does the desk render, does it reach the server — has
# only ever been answered by reading code. This boots a device, installs the
# build, starts it, waits, and keeps a screenshot of the result.
#
# Unsigned on purpose, like the build job: no certificate, no profile, and the
# simulator does not check either. Entitlements are therefore absent, so the App
# Group reads as unprovisioned here — that is a property of this run, not of a
# shipped build.

name: sim-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project CourseMate.xcodeproj \
            -scheme CourseMate \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tail -n 40

      - name: Boot, install, launch
        run: |
          set -uo pipefail

          echo "--- simulators this image actually provides"
          xcrun simctl list devices available | sed -n '/-- iOS/,/^--/p' | head -n 20

          # Resolve the first available iPhone rather than naming one: the image
          # decides which models exist, and a name that is missing fails the job
          # before anything has been tested.
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for rt in sorted(d) for dev in d[rt] if "iPhone" in dev["name"]))')
          echo "device: $DEVICE"
          test -n "$DEVICE" || { echo "::error::no iPhone simulator on this runner"; exit 1; }

          APP="build/Build/Products/Debug-iphonesimulator/CourseMate.app"
          test -d "$APP" || { echo "::error::no app bundle at $APP"; exit 1; }

          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b

          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" us.innotel.coursemate

          # Long enough for the first health request and the first desk poll, so
          # the screenshot shows a connected app rather than a blank launch.
          sleep 15

          mkdir -p shots
          xcrun simctl io "$DEVICE" screenshot shots/launch.png
          ls -l shots
          echo "$DEVICE" > shots/device.txt

      - name: Did it stay up
        if: always()
        run: |
          set -uo pipefail
          # A launch that returns a pid and then dies is the failure this catches.
          DEVICE=$(cat shots/device.txt 2>/dev/null || echo booted)
          echo "--- running processes on $DEVICE"
          xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -i coursemate || echo "not listed (may have exited)"
          echo "--- app log"
          xcrun simctl spawn "${DEVICE:-booted}" log show --last 3m --style compact \
            --predicate 'process == "CourseMate"' 2>/dev/null | tail -n 60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-launch
          path: shots/
          if-no-files-found: warn
          retention-days: 7
